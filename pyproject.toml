[project]
name = "late-delivery"
version = "0.1.0"
description = "Late delivery risk prediction: end-to-end ML system on Olist data"
authors = [
    { name = "Sunnat Axmadov", email = "sunnatakhmad@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fsspec>=2026.9.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.5",
    "pandera[polars]>=0.36.0",
    "polars>=2.1.0",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
late-delivery = "late_delivery.cli:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "scikit-learn>=1.9.1",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["pipelines/airflow_dag.py"]  # generated

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = ["fsspec", "fsspec.*", "pandera", "pandera.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
